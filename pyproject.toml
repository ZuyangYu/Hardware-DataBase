[project]
name = "hardware-database"
version = "0.1.0"
description = "Hardware DataBase: multi-source Q&A for hardware design assets (documents, spreadsheets, circuit designs) over RAGFlow + a deepagents-based agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.8",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-openai>=1.3,<2",
    "langchain-ollama>=1.1.0",
    # src/core/model_factory.py 与 src/agents/runner.py 直接 import langchain /
    # langchain_core(init_chat_model / 消息类型),不能只靠 deepagents 传递提供。
    "langchain>=1.3,<2",
    "langgraph>=1.0.0,<2",
    # LangMem is isolated behind src.memory.manager so the application keeps
    # a stable adapter boundary while the model/store APIs evolve.
    "langmem==0.0.30",
    # The official SQLite projection store is a separate distribution; the
    # langgraph meta-package does not install it.
    "langgraph-checkpoint-sqlite==3.1.1",
    "llama-index-core>=0.12.52,<0.13",
    "networkx>=3.5",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-httpx>=0.59b0,<1",
    "opentelemetry-instrumentation-requests>=0.59b0,<1",
    "opentelemetry-sdk>=1.38,<2",
    "openinference-instrumentation>=0.1.31,<1",
    "openinference-semantic-conventions>=0.1.27,<1",
    "pandas>=2.3.3,<3",
    "pydantic>=2.11.10,<3",
    "python-dotenv>=1.2.1,<2",
    "python-multipart>=0.0.9,<1",
    # kept: vendored SpyDrNet imports requests at module top level
    "requests>=2.32.3,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
hardware-database-eval = "src.evaluation.cli:main"
hardware-database-server = "src.api.app:main"
hardware-database-worker = "src.workers.main:main"
hardware-database-memory-worker = "src.memory.worker:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]
exclude = [
    "src.circuit.vendor.spydrnet.docs*",
    "src.circuit.vendor.spydrnet.examples*",
    "src.circuit.vendor.spydrnet.example_netlists*",
    "src.circuit.vendor.spydrnet.tests*",
    "src.circuit.vendor.spydrnet.spydrnet_extension*.tests*",
]

[tool.setuptools.package-data]
"src.circuit.vendor.spydrnet.spydrnet.support_files" = [
    "*.tcl",
    "architecture_libraries/*.zip",
]

[tool.uv]
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.14.5",
]
eval = [
    "openai>=1.0,<3",
    "ragas>=0.4,<0.5",
]

[tool.pytest.ini_options]
norecursedirs = ["build", "src/circuit/vendor/spydrnet"]

[tool.ruff]
# vendored SpyDrNet (含 sch_parse / spydrnet_extension 等 upstream 风格代码) 不属于本应用源码,不纳入 lint。
extend-exclude = ["src/circuit/vendor", ".claude"]
