[project]
name = "hardware-database"
version = "0.1.0"
description = "Hardware DataBase: multi-source Q&A for hardware design assets (documents, spreadsheets, circuit designs) over RAGFlow + a bounded LangGraph agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0,<2",
    "llama-index-core>=0.12.52,<0.13",
    "networkx>=3.5",
    "pandas>=2.3.3,<3",
    "pydantic>=2.11.10,<3",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.2.1,<2",
    "requests>=2.32.3,<3",
    "streamlit>=1.52.1,<2",
]

[project.scripts]
hardware-database-eval = "src.evaluation.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]
exclude = [
    "src.circuit.vendor.spydrnet.docs*",
    "src.circuit.vendor.spydrnet.examples*",
    "src.circuit.vendor.spydrnet.example_netlists*",
    "src.circuit.vendor.spydrnet.tests*",
    "src.circuit.vendor.spydrnet.spydrnet_extension*.tests*",
]

[tool.setuptools.package-data]
"src.circuit.vendor.spydrnet.spydrnet.support_files" = [
    "*.tcl",
    "architecture_libraries/*.zip",
]

[tool.uv]
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.14.5",
]
eval = [
    "langchain-community>=0.3.31,<0.4",
    "openai>=1.0,<3",
    "ragas>=0.4,<0.5",
]

[tool.pytest.ini_options]
norecursedirs = ["build", "src/circuit/vendor/spydrnet"]

[tool.ruff]
# vendored SpyDrNet (含 sch_parse / spydrnet_extension 等 upstream 风格代码) 与
# Claude Code skill 脚本不属于本应用源码,不纳入 lint。
extend-exclude = ["src/circuit/vendor", ".claude"]
