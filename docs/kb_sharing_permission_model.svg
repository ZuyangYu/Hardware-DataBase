<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" role="img" aria-labelledby="title desc">
  <title id="title">知识库共享权限模型</title>
  <desc id="desc">知识库权限从部门全员可见加逐用户授权，改为私有默认加所有者共享开关。可见性由 knowledge_bases.is_shared、owner_user_id 决定，kb_permissions 表在启动迁移时废弃；前端提供共享切换与危险操作二次确认，服务端落 update_kb_sharing 审计。</desc>
  <defs>
    <style>
      .t { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #18181a; }
      .h2 { font-size: 15px; font-weight: 700; fill: #18181a; }
      .h3 { font-size: 13px; font-weight: 600; fill: #18181a; }
      .body { font-size: 12px; fill: #464c5e; }
      .muted { font-size: 11px; fill: #858b9c; }
      .band { font-size: 12px; font-weight: 700; fill: #5b6478; letter-spacing: 2px; }
      .tag { font-size: 10.5px; fill: #3d5a91; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #3d4657; }
      .card { fill: #ffffff; stroke: #e3e7f1; stroke-width: 1.2; }
      .bandbox { fill: #eef2f8; }
      .blue { fill: #eaf1fb; stroke: #c9d8ef; }
      .green { fill: #e9f5ee; stroke: #c4e3d2; }
      .amber { fill: #fdf3e3; stroke: #ecd5a8; }
      .violet { fill: #f1ecfb; stroke: #d8cbf0; }
      .gray { fill: #f3f4f6; stroke: #dcdfe6; }
      .step { fill: #f6f8fc; stroke: #d7dfee; }
      .flow { stroke: #9cabc8; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flowgreen { stroke: #6aa98a; stroke-width: 1.4; fill: none; marker-end: url(#arrowGreen); }
      .flowplain { stroke: #c3cbd9; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9cabc8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6aa98a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#111111" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1010" fill="#f8fafb"/>
  <text class="t h1" x="60" y="62">知识库共享权限模型 · 私有默认 + 所有者共享开关</text>
  <text class="t body" x="60" y="88">从「部门全员可见 + 逐用户授权」收敛为「所有者私有 + 部门共享开关」，权限绑定只认所有者维度</text>
  <text class="t muted" x="60" y="108">2026-09-17 在途改造；system_admin 仍是治理角色（登记 / 挂载），不参与任何知识库内容访问</text>

  <path class="flow" d="M1080,52 L1120,52"/>
  <text class="t muted" x="1128" y="56">调用 / 权限判定</text>
  <path class="flowgreen" d="M1080,78 L1120,78"/>
  <text class="t muted" x="1128" y="82">数据 / 状态流转</text>

  <!-- ================= 数据模型改造 ================= -->
  <rect class="bandbox" x="40" y="130" width="1520" height="176" rx="16"/>
  <text class="t band" x="60" y="157">数据模型 · auth.db knowledge_bases（逐用户授权表废弃）</text>

  <g filter="url(#soft)">
    <rect class="gray" x="70" y="170" width="710" height="122" rx="12"/>
    <text class="t h3" x="90" y="196">改造前 · 部门全员可见 + 逐用户授权</text>
    <text class="t body" x="90" y="220">knowledge_bases(name, department_id, owner_user_id)</text>
    <text class="t body" x="90" y="240">kb_permissions(kb_id, kb_name, user_id, permission) ← 逐用户授权对象</text>
    <text class="t muted" x="90" y="264">员工对本部门全部知识库隐式 admin；不存在「私有库」概念</text>
  </g>
  <path class="flow" d="M785,231 L815,231"/>
  <text class="t muted" x="800" y="222" text-anchor="middle">迁移</text>
  <g filter="url(#soft)">
    <rect class="green" x="820" y="170" width="710" height="122" rx="12"/>
    <text class="t h3" x="840" y="196">改造后 · 私有默认 + 所有者共享开关</text>
    <text class="t body" x="840" y="220">knowledge_bases(name, department_id, owner_user_id, is_shared)</text>
    <text class="t body" x="840" y="240">启动迁移：kb_permissions 表 DROP，存量库一并转私有（幂等）</text>
    <text class="t muted" x="840" y="264">无主历史库保留部门可见兜底，避免登记数据失联</text>
  </g>

  <!-- ================= 可见性判定与权限矩阵 ================= -->
  <rect class="bandbox" x="40" y="322" width="1520" height="240" rx="16"/>
  <text class="t band" x="60" y="349">可见性判定 · AuthService.list_accessible_kbs / get_kb_permissions_for_user</text>

  <g filter="url(#soft)">
    <rect class="step" x="70" y="364" width="760" height="180" rx="12"/>
    <text class="t h3" x="90" y="390">可见性 SQL（两个方法共用同一条件）</text>
    <text class="t mono" x="90" y="418">WHERE department_id = :user_department</text>
    <text class="t mono" x="108" y="440">AND ( is_shared = 1                  -- 所有者已开启部门共享</text>
    <text class="t mono" x="130" y="460">OR owner_user_id IS NULL          -- 无主历史库：部门可见兜底</text>
    <text class="t mono" x="130" y="480">OR owner_user_id = :actor_id )    -- 自己的知识库</text>
    <text class="t muted" x="90" y="510">私有库对其他员工连名称都不返回（_kb_views 再按 perms 二次过滤）</text>
    <text class="t muted" x="90" y="530">system_admin 走治理视图，保留全部登记信息但无内容权限</text>
  </g>

  <g filter="url(#soft)">
    <rect class="card" x="870" y="364" width="660" height="180" rx="12"/>
    <text class="t h3" x="890" y="390">权限矩阵</text>
    <rect class="bandbox" x="890" y="402" width="620" height="24" rx="4"/>
    <text class="t body" x="902" y="419">角色</text>
    <text class="t body" x="1092" y="419">可见性</text>
    <text class="t body" x="1272" y="419">权限</text>
    <text class="t body" x="902" y="448">知识库所有者</text>
    <text class="t muted" x="1092" y="448">自己的库（私有或共享）</text>
    <text class="t muted" x="1272" y="448">admin：读写 + 共享开关 + 删除库</text>
    <text class="t body" x="902" y="476">部门员工 · 库已共享</text>
    <text class="t muted" x="1092" y="476">可见</text>
    <text class="t muted" x="1272" y="476">admin：读写；删除等危险操作二次确认</text>
    <text class="t body" x="902" y="504">部门员工 · 库私有</text>
    <text class="t muted" x="1092" y="504">不可见（含名称）</text>
    <text class="t muted" x="1272" y="504">无</text>
    <text class="t body" x="902" y="532">system_admin</text>
    <text class="t muted" x="1092" y="532">仅治理元数据视图</text>
    <text class="t muted" x="1272" y="532">无内容权限（路由层直接拒绝）</text>
  </g>

  <!-- ================= 运行时链路 ================= -->
  <rect class="bandbox" x="40" y="578" width="1520" height="200" rx="16"/>
  <text class="t band" x="60" y="605">运行时链路 · 切换共享 = 前端 → API → AuthService → 审计（仅所有者可操作）</text>

  <g filter="url(#soft)">
    <rect class="blue" x="70" y="620" width="330" height="140" rx="12"/>
    <text class="t h3" x="88" y="646">① 前端 KbListPage.tsx</text>
    <text class="t body" x="88" y="668">可见性列：私有 / 部门共享 · 我是所有者</text>
    <text class="t body" x="88" y="688">「部门共享 / 改为私有」仅 is_owner 显示</text>
    <text class="t muted" x="88" y="712">lib/kbSharing.ts 统一文案与前置校验</text>
    <text class="t muted" x="88" y="732">kbDeletionWarning：共享库删除影响全部门</text>
  </g>
  <path class="flow" d="M400,690 L440,690"/>
  <g filter="url(#soft)">
    <rect class="card" x="440" y="620" width="330" height="140" rx="12"/>
    <text class="t h3" x="458" y="646">② PATCH /kbs/{kb}/sharing</text>
    <text class="t body" x="458" y="668">请求体：{ is_shared: boolean }</text>
    <text class="t body" x="458" y="688">require_employee；403 非所有者 / 404 不存在</text>
    <text class="t muted" x="458" y="712">KbView 新增 is_shared / is_owner / owner_user_id</text>
    <text class="t muted" x="458" y="732">响应 OkResponse，前端 onRefresh 回读</text>
  </g>
  <path class="flow" d="M770,690 L810,690"/>
  <g filter="url(#soft)">
    <rect class="green" x="810" y="620" width="330" height="140" rx="12"/>
    <text class="t h3" x="828" y="646">③ AuthService 共享写入</text>
    <text class="t body" x="828" y="668">校验员工角色 + owner_user_id == actor.id</text>
    <text class="t body" x="828" y="688">UPDATE knowledge_bases SET is_shared = ?</text>
    <text class="t muted" x="828" y="712">共享后本部门成员即获完整 admin 权限</text>
    <text class="t muted" x="828" y="732">改回私有立即收回访问与管理权限</text>
  </g>
  <path class="flow" d="M1140,690 L1180,690"/>
  <g filter="url(#soft)">
    <rect class="amber" x="1180" y="620" width="330" height="140" rx="12"/>
    <text class="t h3" x="1198" y="646">④ 审计 update_kb_sharing</text>
    <text class="t body" x="1198" y="668">metadata：is_shared / owner_user_id</text>
    <text class="t body" x="1198" y="688">成功与失败都落审计（fail-soft）</text>
    <text class="t muted" x="1198" y="712">共享/收回时间点可回溯</text>
    <text class="t muted" x="1198" y="732">审计不阻断主流程</text>
  </g>

  <!-- ================= 危险操作 ================= -->
  <rect class="bandbox" x="40" y="794" width="1520" height="180" rx="16"/>
  <text class="t band" x="60" y="821">危险操作与可回溯 · 共享是治理敏感动作（共享后全部门获得 admin）</text>

  <g filter="url(#soft)">
    <rect class="card" x="70" y="836" width="480" height="120" rx="12"/>
    <text class="t h3" x="88" y="862">共享库删除审计</text>
    <text class="t body" x="88" y="884">AppPipeline._kb_sharing_audit_metadata</text>
    <text class="t body" x="88" y="904">metadata: is_shared / owner_user_id / actor_is_owner</text>
    <text class="t muted" x="88" y="928">区分「所有者自删」与「部门成员删除他人共享库」</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="570" y="836" width="480" height="120" rx="12"/>
    <text class="t h3" x="588" y="862">「改为私有」的即时收回</text>
    <text class="t body" x="588" y="884">部门成员立即失去访问与管理权限</text>
    <text class="t body" x="588" y="904">已有内容不删除（提示文案明示）</text>
    <text class="t muted" x="588" y="928">共享开关仅所有者可切换，服务端强校验</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1070" y="836" width="450" height="120" rx="12"/>
    <text class="t h3" x="1088" y="862">测试覆盖（tests/）</text>
    <text class="t body" x="1088" y="884">test_auth_kb_scope：启动迁移 + 权限表清理</text>
    <text class="t body" x="1088" y="904">test_api_routes：PATCH sharing 403 / 404</text>
    <text class="t muted" x="1088" y="928">test_audit_sinks：update_kb_sharing 审计</text>
  </g>
</svg>
