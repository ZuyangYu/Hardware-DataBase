<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1210" width="1600" height="1210" role="img" aria-labelledby="title desc">
  <title id="title">资产中心架构设计</title>
  <desc id="desc">资产中心由文档资产、知识 Wiki、知识图谱三块能力组成，前端经 API 路由调用 DocumentAssetService 与 WikiService，素材来自 pipeline_documents.db、table_indexes.db、pipeline_archives 与 RAGFlow。</desc>
  <defs>
    <style>
      .t { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #18181a; }
      .h2 { font-size: 15px; font-weight: 700; fill: #18181a; }
      .h3 { font-size: 13px; font-weight: 600; fill: #18181a; }
      .body { font-size: 12px; fill: #464c5e; }
      .muted { font-size: 11px; fill: #858b9c; }
      .band { font-size: 12px; font-weight: 700; fill: #5b6478; letter-spacing: 2px; }
      .tag { font-size: 10.5px; fill: #3d5a91; }
      .card { fill: #ffffff; stroke: #e3e7f1; stroke-width: 1.2; }
      .bandbox { fill: #eef2f8; }
      .blue { fill: #eaf1fb; stroke: #c9d8ef; }
      .green { fill: #e9f5ee; stroke: #c4e3d2; }
      .amber { fill: #fdf3e3; stroke: #ecd5a8; }
      .violet { fill: #f1ecfb; stroke: #d8cbf0; }
      .step { fill: #f6f8fc; stroke: #d7dfee; }
      .flow { stroke: #9cabc8; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flowgreen { stroke: #6aa98a; stroke-width: 1.4; fill: none; marker-end: url(#arrowGreen); }
      .flowplain { stroke: #c3cbd9; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9cabc8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6aa98a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#111111" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1210" fill="#f8fafb"/>
  <text class="t h1" x="60" y="62">资产中心（Asset Center）架构设计</text>
  <text class="t body" x="60" y="88">一个知识库范围内的三条能力线：文档资产（一文档一档）· 知识 Wiki（文档蒸馏）· 知识图谱（互链推导）</text>
  <text class="t muted" x="60" y="108">所有页面与接口都按 KB / 部门作用域鉴权（system_admin 不可访问 KB 内容）</text>

  <path class="flow" d="M1080,52 L1120,52"/>
  <text class="t muted" x="1128" y="56">调用 / 数据读写</text>
  <path class="flowgreen" d="M1080,78 L1120,78"/>
  <text class="t muted" x="1128" y="82">素材供给</text>

  <!-- ================= 前端展示层 ================= -->
  <rect class="bandbox" x="40" y="130" width="1520" height="150" rx="16"/>
  <text class="t band" x="60" y="158">前端展示层 · frontend/src/pages/DocumentAssetsPage.tsx（/assets?tab=&amp;kb=）</text>

  <g filter="url(#soft)">
    <rect class="card" x="70" y="172" width="470" height="92" rx="12"/>
    <text class="t h2" x="90" y="200">① 文档资产 Tab</text>
    <text class="t body" x="90" y="222">资产列表 / 详情抽屉：元数据、版本链、生命周期、事件流</text>
    <text class="t body" x="90" y="242">操作：登记新版本 · 关联文档 · 从知识库文件建档（影子档回填）</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="565" y="172" width="470" height="92" rx="12"/>
    <text class="t h2" x="585" y="200">② 知识 Wiki Tab（WikiPage.tsx）</text>
    <text class="t body" x="585" y="222">页面浏览 / 筛选 / 详情：出链、反链、来源文档、出处锚点</text>
    <text class="t body" x="585" y="242">人工编辑 · 归档 · 重新发布 · 版本回滚 · 触发生成（粒度/页数上限）</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1060" y="172" width="470" height="92" rx="12"/>
    <text class="t h2" x="1080" y="200">③ 知识图谱 Tab（WikiGraph.tsx）</text>
    <text class="t body" x="1080" y="222">零依赖 SVG 力导向渲染：节点=页面，边=Wiki 互链</text>
    <text class="t body" x="1080" y="242">类型过滤（摘要/词条/概念/索引）· 点击节点 → 深链到 Wiki 详情</text>
  </g>

  <path class="flow" d="M305,264 L305,300"/>
  <path class="flow" d="M800,264 L800,300"/>
  <path class="flow" d="M1295,264 L1295,300"/>
  <!-- ================= API 路由层 ================= -->
  <rect class="bandbox" x="40" y="306" width="1520" height="106" rx="16"/>
  <text class="t band" x="60" y="334">API 路由层 · src/api/routes/（FastAPI，全部挂 /api/v1/kbs/{kb_name}/…）</text>

  <g filter="url(#soft)">
    <rect class="blue" x="70" y="346" width="470" height="52" rx="10"/>
    <text class="t h3" x="90" y="368">doc_assets.py · DocumentAssetService 门面</text>
    <text class="t muted" x="90" y="386">/doc-assets · /{id}/versions · /links · /backfill</text>
  </g>
  <g filter="url(#soft)">
    <rect class="green" x="565" y="346" width="470" height="52" rx="10"/>
    <text class="t h3" x="585" y="368">wiki.py · WikiService 门面</text>
    <text class="t muted" x="585" y="386">/wiki/ingest · /status · /pages · /graph</text>
  </g>
  <g filter="url(#soft)">
    <rect class="amber" x="1060" y="346" width="230" height="52" rx="10"/>
    <text class="t h3" x="1080" y="368">files.py / assets.py</text>
    <text class="t muted" x="1080" y="386">已解析文件 · 资产候选生成</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1305" y="346" width="225" height="52" rx="10"/>
    <text class="t h3" x="1325" y="368">deps / context</text>
    <text class="t muted" x="1325" y="386">认证 · KB 作用域 · 403/404 收口</text>
  </g>

  <path class="flow" d="M305,412 L305,456"/>
  <path class="flow" d="M800,412 L800,456"/>
  <path class="flow" d="M1175,412 L1175,456"/>
  <path class="flow" d="M1417,412 L1417,498"/>

  <!-- ================= 核心服务层 ================= -->
  <rect class="bandbox" x="40" y="462" width="1520" height="404" rx="16"/>
  <text class="t band" x="60" y="490">核心服务层 · 业务逻辑与蒸馏流水线</text>

  <!-- DocumentAssetService -->
  <g filter="url(#soft)">
    <rect class="card" x="1060" y="506" width="470" height="230" rx="14"/>
    <text class="t h2" x="1082" y="536">DocumentAssetService（src/core/doc_assets.py）</text>
    <text class="t body" x="1082" y="560">auth.db 内的资产账本，与解析产物解耦：</text>
    <rect class="step" x="1082" y="574" width="134" height="66" rx="9"/>
    <text class="t h3" x="1096" y="596">影子建档</text>
    <text class="t muted" x="1096" y="614">解析完成 → 自动补录</text>
    <text class="t muted" x="1096" y="630">认领后完善标题/类别</text>
    <rect class="step" x="1228" y="574" width="134" height="66" rx="9"/>
    <text class="t h3" x="1242" y="596">版本链</text>
    <text class="t muted" x="1242" y="614">登记新版本即生效</text>
    <text class="t muted" x="1242" y="630">旧版自动「已替代」</text>
    <rect class="step" x="1374" y="574" width="134" height="66" rx="9"/>
    <text class="t h3" x="1388" y="596">生命周期 + 事件</text>
    <text class="t muted" x="1388" y="614">生效/替代/作废</text>
    <text class="t muted" x="1388" y="630">变更全程留痕</text>
    <text class="t body" x="1082" y="664">关联链接：文档 ↔ 文件版本 / Wiki 页 / 其他资产，可双向跳转</text>
    <text class="t body" x="1082" y="686">建账来源：pipeline_documents 的 content_hash + 版本登记，避免重复建档</text>
    <text class="t body" x="1082" y="708">删除/清理由 PipelineAssetCleanupService 级联（KB 删除时回收）</text>
  </g>

  <!-- WikiService -->
  <g filter="url(#soft)">
    <rect class="card" x="70" y="506" width="950" height="334" rx="14"/>
    <text class="t h2" x="92" y="536">WikiService（src/core/wiki.py）· 文档 → 知识 Wiki 蒸馏流水线</text>
    <text class="t body" x="92" y="558">按文档串行、逐文档 fail-soft；后台线程执行，进度 stage 实时上报；页面落在 auth.db 的 wiki_pages / wiki_page_revisions</text>

    <!-- 流水线 6 步 -->
    <g>
      <rect class="step" x="92" y="578" width="140" height="74" rx="10"/>
      <text class="t h3" x="104" y="602">1 素材采集</text>
      <text class="t muted" x="104" y="620">表格块 / RAGFlow</text>
      <text class="t muted" x="104" y="636">三层过滤去样板</text>

      <rect class="step" x="244" y="578" width="140" height="74" rx="10"/>
      <text class="t h3" x="256" y="602">2 候选抽取</text>
      <text class="t muted" x="256" y="620">Pass0: entities</text>
      <text class="t muted" x="256" y="636">+ concepts JSON</text>

      <rect class="step" x="396" y="578" width="140" height="74" rx="10"/>
      <text class="t h3" x="408" y="602">3 引用回填</text>
      <text class="t muted" x="408" y="620">citation: 候选 →</text>
      <text class="t muted" x="408" y="636">原文块批量映射</text>

      <rect class="step" x="548" y="578" width="140" height="74" rx="10"/>
      <text class="t h3" x="560" y="602">4 页面写入</text>
      <text class="t muted" x="560" y="620">每文档摘要页</text>
      <text class="t muted" x="560" y="636">+ 词条/概念页</text>

      <rect class="step" x="700" y="578" width="140" height="74" rx="10"/>
      <text class="t h3" x="712" y="602">5 互链重建</text>
      <text class="t muted" x="712" y="620">[[slug]] 出链</text>
      <text class="t muted" x="712" y="636">反链 / 死链清理</text>

      <rect class="step" x="852" y="578" width="146" height="74" rx="10"/>
      <text class="t h3" x="864" y="602">6 知识图谱</text>
      <text class="t muted" x="864" y="620">in/out links</text>
      <text class="t muted" x="864" y="636">→ SVG 渲染</text>

      <path class="flow" d="M232,615 L244,615"/>
      <path class="flow" d="M384,615 L396,615"/>
      <path class="flow" d="M536,615 L548,615"/>
      <path class="flow" d="M688,615 L700,615"/>
      <path class="flow" d="M840,615 L852,615"/>
    </g>

    <text class="t h3" x="92" y="692">质量与治理设计</text>
    <text class="t body" x="92" y="714">· 人工编辑即锁定（last_edit_source=user）：重蒸馏跳过，防「改完 → 重跑 → 又坏」；回滚自动解锁</text>
    <text class="t body" x="92" y="736">· 每页保留版本快照 + 行级回滚；摘要/词条/概念/索引四种页面类型；按被引次数择优写入（页数上限）</text>
    <text class="t body" x="92" y="758">· 素材侧三层过滤：样板 sheet 名 → 跨文档重复块 → 审批/封面临时行；大表按 sheet 内等距抽样，避免只取表头</text>
    <text class="t body" x="92" y="780">· 批处理优先级：走 LLM governor 的 batch 通道，永不挤占在线问答；用量进 UsageLedger</text>

    <rect class="violet" x="92" y="796" width="906" height="30" rx="8"/>
    <text class="t tag" x="104" y="816">蒸馏任务现状：进程内后台线程 + 内存态进度（服务重启会丢，属下一阶段：持久化任务表 / 死信重试）</text>
  </g>

  <!-- 素材来源 -->
  <g filter="url(#soft)">
    <rect class="card" x="1060" y="752" width="470" height="88" rx="12"/>
    <text class="t h2" x="1082" y="780">素材 / 解析来源（只读）</text>
    <text class="t body" x="1082" y="802">pipeline_documents.db（解析台账）· table_indexes.db（表格块）</text>
    <text class="t body" x="1082" y="822">pipeline_archives（原件归档）· RAGFlow chunks · circuits（网表）</text>
  </g>

  <path class="flowgreen" d="M1060,796 C1035,780 1030,710 1022,660"/>
  <path class="flow" d="M1240,752 L1240,740"/>

  <!-- ================= 数据层 ================= -->
  <path class="flow" d="M305,840 L305,900"/>
  <path class="flow" d="M1060,700 L1045,700 L1045,904"/>

  <rect class="bandbox" x="40" y="906" width="1520" height="126" rx="16"/>
  <text class="t band" x="60" y="934">数据层 · 资产中心的两本账 + 一份解析底账（全部按 department_id + kb_id 作用域）</text>

  <g filter="url(#soft)">
    <rect class="blue" x="70" y="946" width="470" height="66" rx="10"/>
    <text class="t h3" x="90" y="970">auth.db · 文档资产账</text>
    <text class="t muted" x="90" y="990">doc_assets · doc_asset_versions · doc_asset_events · doc_asset_links</text>
  </g>
  <g filter="url(#soft)">
    <rect class="green" x="565" y="946" width="470" height="66" rx="10"/>
    <text class="t h3" x="585" y="970">auth.db · Wiki 账</text>
    <text class="t muted" x="585" y="990">wiki_pages（content/summary/links/版本号）· wiki_page_revisions</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1060" y="946" width="470" height="66" rx="10"/>
    <text class="t h3" x="1080" y="970">解析底账 / 原件</text>
    <text class="t muted" x="1080" y="990">pipeline_documents.db · table_indexes/ · pipeline_archives/</text>
  </g>

  <!-- ================= 横切能力 ================= -->
  <path class="flowplain" d="M305,1012 L305,1058"/>
  <path class="flowplain" d="M800,1012 L800,1058"/>
  <path class="flowplain" d="M1295,1012 L1295,1058"/>

  <rect class="bandbox" x="40" y="1064" width="1520" height="110" rx="16"/>
  <text class="t band" x="60" y="1092">横切能力 · 三块能力共用</text>

  <g filter="url(#soft)">
    <rect class="card" x="70" y="1102" width="360" height="56" rx="10"/>
    <text class="t h3" x="88" y="1124">权限与作用域</text>
    <text class="t muted" x="88" y="1142">部门员工 = 本部门 KB 隐式 admin；system_admin 禁入</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="450" y="1102" width="360" height="56" rx="10"/>
    <text class="t h3" x="468" y="1124">模型治理</text>
    <text class="t muted" x="468" y="1142">LLM governor batch 通道 + UsageLedger 用量账本</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="830" y="1102" width="350" height="56" rx="10"/>
    <text class="t h3" x="848" y="1124">可信与可回溯</text>
    <text class="t muted" x="848" y="1142">来源文档 / 出处锚点 / 修订历史 / 死链清理</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1200" y="1102" width="330" height="56" rx="10"/>
    <text class="t h3" x="1218" y="1124">可靠性</text>
    <text class="t muted" x="1218" y="1142">fail-open：工具/单文档失败降级不阻断</text>
  </g>
</svg>
