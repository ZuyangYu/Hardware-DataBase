<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Hardware-RAG project architecture and barriers</title>
  <desc id="desc">Enterprise hardware knowledge platform architecture with department permissions, multi-source retrieval, evidence grounding, audit logs, and managed pipelines.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #53627a; }
      .section-title { font: 700 19px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #182235; }
      .label { font: 600 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #1f2a3d; }
      .small { font: 400 13px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #4d5b70; }
      .tiny { font: 400 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #637087; }
      .pill-text { font: 600 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d6dde8; stroke-width: 1.3; rx: 10; }
      .card-strong { fill: #ffffff; stroke: #73839a; stroke-width: 1.5; rx: 10; }
      .shadow { filter: drop-shadow(0px 10px 20px rgba(31, 42, 61, 0.10)); }
      .blue { fill: #e8f1ff; stroke: #80a7dc; }
      .teal { fill: #e6f6f4; stroke: #62b6aa; }
      .green { fill: #eaf7ec; stroke: #76b981; }
      .amber { fill: #fff5dd; stroke: #d9aa4d; }
      .red { fill: #fff0f0; stroke: #d77a7a; }
      .purple { fill: #f1edff; stroke: #9a84d6; }
      .dark { fill: #1d3557; }
      .route { stroke: #7d8aa1; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .route-strong { stroke: #176b87; stroke-width: 3; fill: none; marker-end: url(#arrowStrong); }
      .route-dashed { stroke: #9aa6b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .divider { stroke: #d8dee9; stroke-width: 1; }
      .lane { fill: #ffffff; stroke: #e0e6ef; stroke-width: 1.2; rx: 18; }
      .badge-blue { fill: #2f6fed; }
      .badge-teal { fill: #16877a; }
      .badge-green { fill: #2d8a4b; }
      .badge-amber { fill: #b47512; }
      .badge-red { fill: #b94747; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#7d8aa1"/>
    </marker>
    <marker id="arrowStrong" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#176b87"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="70" y="62">Hardware-RAG 企业级硬件知识治理与多源检索平台</text>
  <text class="subtitle" x="70" y="94">核心价值：把“个人挂文件问模型”升级为可权限控制、可追溯、可运营、可复用的部门知识基础设施</text>

  <rect class="lane shadow" x="48" y="126" width="1504" height="690"/>
  <line class="divider" x1="48" y1="232" x2="1552" y2="232"/>
  <line class="divider" x1="48" y1="376" x2="1552" y2="376"/>
  <line class="divider" x1="48" y1="555" x2="1552" y2="555"/>
  <line class="divider" x1="48" y1="690" x2="1552" y2="690"/>

  <text class="section-title" x="72" y="166">1. 入口与权限边界</text>
  <text class="section-title" x="72" y="272">2. Agentic 编排与检索决策</text>
  <text class="section-title" x="72" y="416">3. 多源知识资产与索引管线</text>
  <text class="section-title" x="72" y="596">4. 可信答案、证据链与运营闭环</text>
  <text class="section-title" x="72" y="730">项目壁垒：平台能力，而不是一次性 Prompt</text>

  <!-- Users and permissions -->
  <rect class="card blue" x="220" y="150" width="205" height="60"/>
  <text class="label" x="242" y="176">用户与角色</text>
  <text class="small" x="242" y="197">系统管理员 / 部门管理员 / 普通用户</text>

  <rect class="card teal" x="475" y="150" width="230" height="60"/>
  <text class="label" x="497" y="176">AuthService</text>
  <text class="small" x="497" y="197">登录、部门、KB 授权、read/write/admin</text>

  <rect class="card green" x="760" y="150" width="230" height="60"/>
  <text class="label" x="782" y="176">RequestContext</text>
  <text class="small" x="782" y="197">department_id + kb_permissions 全链路透传</text>

  <rect class="card amber" x="1048" y="150" width="260" height="60"/>
  <text class="label" x="1070" y="176">Streamlit 工作台</text>
  <text class="small" x="1070" y="197">查询、上传、任务状态、权限管理、日志</text>

  <path class="route-strong" d="M425 180 H475"/>
  <path class="route-strong" d="M705 180 H760"/>
  <path class="route-strong" d="M990 180 H1048"/>

  <!-- Agent layer -->
  <rect class="card-strong purple shadow" x="205" y="292" width="285" height="62"/>
  <text class="label" x="228" y="318">MultiSourceAgentRunner</text>
  <text class="small" x="228" y="339">LangGraph 状态机：路由、规划、检索、补检索、作答</text>

  <rect class="card blue" x="545" y="270" width="210" height="84"/>
  <text class="label" x="567" y="296">查询理解</text>
  <text class="small" x="567" y="318">route_query</text>
  <text class="small" x="567" y="338">analyze_question</text>

  <rect class="card teal" x="805" y="270" width="240" height="84"/>
  <text class="label" x="827" y="296">检索规划</text>
  <text class="small" x="827" y="318">PipelineCatalogTool 扫描可用源</text>
  <text class="small" x="827" y="338">按子问题生成 search fanout</text>

  <rect class="card green" x="1095" y="270" width="250" height="84"/>
  <text class="label" x="1117" y="296">充分性判断与补检索</text>
  <text class="small" x="1117" y="318">coverage matrix / retrieval ledger</text>
  <text class="small" x="1117" y="338">缺口驱动第二轮、多轮检索</text>

  <path class="route-strong" d="M1308 180 C1370 215 1370 300 1345 318"/>
  <path class="route" d="M490 323 H545"/>
  <path class="route" d="M755 312 H805"/>
  <path class="route" d="M1045 312 H1095"/>

  <!-- Knowledge and pipeline layer -->
  <rect class="card teal" x="190" y="438" width="230" height="86"/>
  <text class="label" x="212" y="464">RAGFlow 文档检索</text>
  <text class="small" x="212" y="486">Word / PDF / 普通文档</text>
  <text class="small" x="212" y="506">governance + design 物理 dataset</text>

  <rect class="card green" x="470" y="438" width="240" height="86"/>
  <text class="label" x="492" y="464">Spreadsheet Pipeline</text>
  <text class="small" x="492" y="486">Excel 行语义检索、单元格精确检索</text>
  <text class="small" x="492" y="506">部门 + KB 物理隔离索引</text>

  <rect class="card amber" x="760" y="438" width="235" height="86"/>
  <text class="label" x="782" y="464">PipelineDocumentStore</text>
  <text class="small" x="782" y="486">文件台账、dataset/document 映射</text>
  <text class="small" x="782" y="506">状态、hash、source_group、department</text>

  <rect class="card purple" x="1045" y="438" width="230" height="86"/>
  <text class="label" x="1067" y="464">Archive + Runtime</text>
  <text class="small" x="1067" y="486">上传归档、解析 worker、失败回滚</text>
  <text class="small" x="1067" y="506">可重试、可删除、可清理</text>

  <rect class="card red" x="1325" y="438" width="155" height="86"/>
  <text class="label" x="1345" y="464">Source Group</text>
  <text class="small" x="1345" y="486">文档资料 / 设计数据</text>
  <text class="small" x="1345" y="506">物料 / 测试 / 项目</text>

  <path class="route" d="M925 354 C860 398 620 418 590 438"/>
  <path class="route" d="M925 354 C840 398 330 418 305 438"/>
  <path class="route-dashed" d="M590 438 V390 C680 370 800 370 878 438"/>
  <path class="route-dashed" d="M1160 438 V390 C1065 370 955 370 878 438"/>
  <path class="route-dashed" d="M1275 482 H1325"/>

  <!-- Answer and observability -->
  <rect class="card-strong blue shadow" x="210" y="616" width="300" height="50"/>
  <text class="label" x="232" y="646">证据融合与冲突检查</text>

  <rect class="card-strong teal shadow" x="570" y="616" width="300" height="50"/>
  <text class="label" x="592" y="646">LLM 自然语言回答生成</text>

  <rect class="card-strong green shadow" x="930" y="616" width="280" height="50"/>
  <text class="label" x="952" y="646">引用来源与可追溯证据</text>

  <rect class="card-strong amber shadow" x="1270" y="604" width="210" height="74"/>
  <text class="label" x="1292" y="632">AppLogService</text>
  <text class="small" x="1292" y="654">审计日志 / 查询日志 / 检索摘要</text>

  <path class="route-strong" d="M510 641 H570"/>
  <path class="route-strong" d="M870 641 H930"/>
  <path class="route" d="M1210 641 H1270"/>

  <!-- Barrier summary -->
  <rect class="card red" x="205" y="752" width="270" height="42"/>
  <text class="label" x="227" y="779">个人挂文件问模型</text>
  <text class="small" x="500" y="779">一次性上下文、权限不可控、证据难审计、知识不可复用、文件版本难治理</text>

  <rect class="card green" x="205" y="820" width="270" height="42"/>
  <text class="label" x="227" y="847">本项目平台化壁垒</text>
  <text class="small" x="500" y="847">部门级权限隔离、多源资产治理、结构化表格检索、证据链、审计、可运营管线、统一知识入口</text>

  <rect class="dark" x="70" y="888" width="1460" height="54" rx="12"/>
  <text class="pill-text" x="96" y="922">汇报口径</text>
  <text class="pill-text" x="196" y="922">这个项目不是替代 Codex/Claude Code，而是把模型能力纳入企业知识治理：让正确的人，在正确权限下，基于正确版本的多源证据，得到可追溯答案。</text>

  <!-- Badges -->
  <rect class="badge-blue" x="1370" y="42" width="112" height="26" rx="13"/>
  <text class="pill-text" x="1388" y="60">权限隔离</text>
  <rect class="badge-teal" x="1370" y="76" width="112" height="26" rx="13"/>
  <text class="pill-text" x="1388" y="94">多源检索</text>
  <rect class="badge-green" x="1490" y="42" width="112" height="26" rx="13"/>
  <text class="pill-text" x="1508" y="60">证据可信</text>
  <rect class="badge-amber" x="1490" y="76" width="112" height="26" rx="13"/>
  <text class="pill-text" x="1508" y="94">可运营</text>
</svg>
