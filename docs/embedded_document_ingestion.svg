<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="title desc">
  <title id="title">嵌入文档入库链路</title>
  <desc id="desc">容器 xlsx/docx 内的 OOXML 嵌入对象从只计数升级为递归入库：解包、命名、内容判重、按扩展名路由、台账父引用、级联删除，并支持存量回填与 RAGFlow 解析状态自动刷新。</desc>
  <defs>
    <style>
      .t { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #18181a; }
      .h2 { font-size: 15px; font-weight: 700; fill: #18181a; }
      .h3 { font-size: 13px; font-weight: 600; fill: #18181a; }
      .body { font-size: 12px; fill: #464c5e; }
      .muted { font-size: 11px; fill: #858b9c; }
      .band { font-size: 12px; font-weight: 700; fill: #5b6478; letter-spacing: 2px; }
      .tag { font-size: 10.5px; fill: #3d5a91; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #3d4657; }
      .card { fill: #ffffff; stroke: #e3e7f1; stroke-width: 1.2; }
      .bandbox { fill: #eef2f8; }
      .blue { fill: #eaf1fb; stroke: #c9d8ef; }
      .green { fill: #e9f5ee; stroke: #c4e3d2; }
      .amber { fill: #fdf3e3; stroke: #ecd5a8; }
      .violet { fill: #f1ecfb; stroke: #d8cbf0; }
      .step { fill: #f6f8fc; stroke: #d7dfee; }
      .flow { stroke: #9cabc8; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flowgreen { stroke: #6aa98a; stroke-width: 1.4; fill: none; marker-end: url(#arrowGreen); }
      .flowplain { stroke: #c3cbd9; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9cabc8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6aa98a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#111111" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" fill="#f8fafb"/>
  <text class="t h1" x="60" y="62">嵌入文档入库链路 · 容器 OOXML 递归展开（P1-1）</text>
  <text class="t body" x="60" y="88">容器 xlsx / docx 内的嵌入对象从「只计数、不处理」升级为「解包 → 递归入库 → 父引用台账 → 级联删除」</text>
  <text class="t muted" x="60" y="108">实测样本：架构说明书.xlsx 含 17 个 OOXML 嵌入对象（16 Word + 1 Excel）、23 媒体、12 绘图；改造前嵌入内容完全检索不到</text>

  <path class="flow" d="M1080,52 L1120,52"/>
  <text class="t muted" x="1128" y="56">主链路步骤</text>
  <path class="flowgreen" d="M1080,78 L1120,78"/>
  <text class="t muted" x="1128" y="82">数据 / 状态流转</text>

  <!-- ================= 主链路 ================= -->
  <rect class="bandbox" x="40" y="130" width="1520" height="548" rx="16"/>
  <text class="t band" x="60" y="157">入库主链路 · IngestionOrchestrator.upload_files（src/pipelines/ingestion.py）</text>

  <g filter="url(#soft)">
    <rect class="blue" x="70" y="172" width="340" height="152" rx="12"/>
    <text class="t h3" x="88" y="198">① 容器上传</text>
    <text class="t body" x="88" y="222">.xlsx / .docx（OOXML = zip）</text>
    <text class="t body" x="88" y="242">内容 hash 判重 → 复用分支</text>
    <text class="t muted" x="88" y="266">归档后交给处理器前扫描嵌入对象</text>
    <text class="t muted" x="88" y="286">单个父文档的入库流程保持不变</text>
  </g>
  <path class="flow" d="M410,248 L440,248"/>
  <g filter="url(#soft)">
    <rect class="step" x="440" y="172" width="340" height="152" rx="12"/>
    <text class="t h3" x="458" y="198">② 嵌入对象清点与解包</text>
    <text class="t body" x="458" y="222">container_inspector 清点（17 / 23 / 12）</text>
    <text class="t body" x="458" y="242">embedded_extractor 扫描 xl|word/embeddings/*</text>
    <text class="t muted" x="458" y="266">stdlib zipfile，无新增依赖</text>
    <text class="t muted" x="458" y="286">非 OOXML（OLE .bin）→ skipped 保留计数</text>
  </g>
  <path class="flow" d="M780,248 L810,248"/>
  <g filter="url(#soft)">
    <rect class="step" x="810" y="172" width="340" height="152" rx="12"/>
    <text class="t h3" x="828" y="198">③ 内容判重与命名</text>
    <text class="t body" x="828" y="222">SHA-256 判重（嵌入名通用，不按名字）</text>
    <text class="t body" x="828" y="242">docx 取正文首段作标题</text>
    <text class="t muted" x="828" y="266">命名：父名 [嵌入] 标题.ext</text>
    <text class="t muted" x="828" y="286">同父重名追加 #hash6；original_file_name 保留</text>
  </g>
  <path class="flow" d="M1150,248 L1180,248"/>
  <g filter="url(#soft)">
    <rect class="amber" x="1180" y="172" width="340" height="152" rx="12"/>
    <text class="t h3" x="1198" y="198">④ 递归入库（深度 1 截断）</text>
    <text class="t body" x="1198" y="222">upload_files(embed_depth+1, parent)</text>
    <text class="t body" x="1198" y="242">嵌入子不再二次展开（防嵌套）</text>
    <text class="t muted" x="1198" y="266">单子失败隔离：只报 warning</text>
    <text class="t muted" x="1198" y="286">不影响父文档入库结果</text>
  </g>

  <path class="flowplain" d="M240,324 L240,368"/>
  <path class="flowplain" d="M610,324 L610,368"/>
  <path class="flowplain" d="M980,324 L980,368"/>
  <path class="flowplain" d="M1350,324 L1350,368"/>

  <g filter="url(#soft)">
    <rect class="card" x="70" y="374" width="470" height="288" rx="12"/>
    <text class="t h3" x="90" y="402">⑤ 按扩展名分支路由</text>
    <text class="t body" x="90" y="428">.docx → RAGFlow 语义检索</text>
    <text class="t muted" x="108" y="448">叙述性 / 选型论证文本可被 document_search 命中</text>
    <text class="t body" x="90" y="476">.xlsx → 表格管线（物化 + SQL）</text>
    <text class="t muted" x="108" y="496">进 table_indexes.db，可被 spreadsheet_* 工具查询</text>
    <text class="t body" x="90" y="524">.pptx / 其他 → 无对应管线</text>
    <text class="t muted" x="108" y="544">按「单子失败隔离」提示，不影响父文档</text>
    <text class="t muted" x="90" y="584">内容 hash 命中已有记录时走复用分支：</text>
    <text class="t muted" x="90" y="604">同一个嵌入 payload 被多个父引用 → 只存一行</text>
    <text class="t muted" x="90" y="624">并追加父引用（见 ⑦ 共享子）</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="565" y="374" width="470" height="288" rx="12"/>
    <text class="t h3" x="585" y="402">⑥ 台账字段与父引用</text>
    <text class="t body" x="585" y="428">pipeline_documents 新增两列：</text>
    <text class="t mono" x="605" y="450">embed_depth INTEGER DEFAULT 0</text>
    <text class="t mono" x="605" y="470">parent_document TEXT（JSON 父列表）</text>
    <text class="t body" x="585" y="498">update_embedding_meta：子记录落父引用</text>
    <text class="t body" x="585" y="520">add_parent_reference：共享子追加父名</text>
    <text class="t body" x="585" y="542">list_embedded_children：按父查子</text>
    <text class="t muted" x="585" y="576">列迁移走 _ensure_columns，存量库自动加列</text>
    <text class="t muted" x="585" y="604">判重始终按内容 hash，不按文件名</text>
    <text class="t muted" x="585" y="632">（嵌入名 Microsoft_Word_DocumentN 跨父重复）</text>
  </g>
  <g filter="url(#soft)">
    <rect class="green" x="1060" y="374" width="470" height="288" rx="12"/>
    <text class="t h3" x="1080" y="402">⑦ 级联删除（删父 → 处理子）</text>
    <text class="t body" x="1080" y="428">RAGFlowBackend._delete_embedded_children</text>
    <text class="t body" x="1080" y="454">remove_parent_reference(child, 父名)</text>
    <text class="t body" x="1080" y="480">还能被其他父引用 → 保留子文档</text>
    <text class="t body" x="1080" y="506">引用清空（孤儿）→ 完整删除：</text>
    <text class="t muted" x="1100" y="526">远端数据集 + 本地表格索引 + 归档 + 台账</text>
    <text class="t muted" x="1080" y="560">fail-soft：子清理失败只写审计 errors，</text>
    <text class="t muted" x="1080" y="580">不影响父文档删除结果</text>
    <text class="t muted" x="1080" y="612">同步文档资产台账（sync_file_deleted）</text>
    <text class="t muted" x="1080" y="640">审计 metadata 记录 embedded_cleanup_errors</text>
  </g>

  <!-- ================= 存量回填与状态同步 ================= -->
  <rect class="bandbox" x="40" y="694" width="1520" height="180" rx="16"/>
  <text class="t band" x="60" y="721">存量回填与解析状态同步 · 让旧数据与 UI 都看到真实状态</text>

  <g filter="url(#soft)">
    <rect class="violet" x="70" y="736" width="730" height="120" rx="12"/>
    <text class="t h3" x="90" y="762">存量父文档自动回填</text>
    <text class="t body" x="90" y="786">复用分支检测：父文档已入库但 list_embedded_children 为空</text>
    <text class="t body" x="90" y="806">（P1-1 之前上线的旧数据）重新上传该父文档即自动补展开</text>
    <text class="t muted" x="90" y="832">无需手工脚本迁移；展开结果与首次入库一致（含父引用与级联删除能力）</text>
  </g>
  <g filter="url(#soft)">
    <rect class="violet" x="820" y="736" width="710" height="120" rx="12"/>
    <text class="t h3" x="840" y="762">RAGFlow 解析状态自动刷新</text>
    <text class="t body" x="840" y="786">问题：上传时读不到实时进度 → 本地台账永远停留在 parsing</text>
    <text class="t body" x="840" y="806">refresh_parse_statuses：默认 60s 节流（RAGFLOW_STATUS_REFRESH_MIN_SECONDS）</text>
    <text class="t muted" x="840" y="832">远端 done → parsed / failed → failed + 错误信息；standalone worker 每轮调用</text>
  </g>

  <!-- ================= 验收 ================= -->
  <rect class="bandbox" x="40" y="890" width="1520" height="190" rx="16"/>
  <text class="t band" x="60" y="917">真实链路验收 · 本机 RAGFlow（架构说明书.xlsx → 18 条记录）</text>

  <g filter="url(#soft)">
    <rect class="card" x="70" y="932" width="355" height="92" rx="10"/>
    <text class="t h3" x="88" y="958">入库结果</text>
    <text class="t body" x="88" y="982">1 父 + 16 docx + 1 xlsx = 18 条</text>
    <text class="t muted" x="88" y="1004">全部携带父引用与 embed_depth</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="445" y="932" width="355" height="92" rx="10"/>
    <text class="t h3" x="463" y="958">嵌入 docx 可检索</text>
    <text class="t body" x="463" y="982">命中「MCU 选型方案对比」原文</text>
    <text class="t muted" x="463" y="1004">改造前该内容完全丢失</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="820" y="932" width="355" height="92" rx="10"/>
    <text class="t h3" x="838" y="958">嵌入 xlsx 可 SQL</text>
    <text class="t body" x="838" y="982">物化为 t_158_1（30 行）</text>
    <text class="t muted" x="838" y="1004">SQL COUNT 可查</text>
  </g>
  <g filter="url(#soft)">
    <rect class="card" x="1195" y="932" width="330" height="92" rx="10"/>
    <text class="t h3" x="1213" y="958">级联删除</text>
    <text class="t body" x="1213" y="982">删父 → 17 个子记录清零</text>
    <text class="t muted" x="1213" y="1004">远端 + 表格索引 + 归档同步清理</text>
  </g>
  <rect class="violet" x="70" y="1038" width="1455" height="30" rx="8"/>
  <text class="t tag" x="84" y="1058">单测 21 项：embedded_extractor · embedded_ingestion · embedded_store_metadata · embedded_cascade_delete · parse_status_refresh</text>
</svg>
