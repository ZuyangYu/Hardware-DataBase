<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Agent 检索链路优化前后对照</title>
  <desc id="desc">对比 multi-KB R3 优化前后的 Agent 运行时、附件读取、文档比较、多库关系、工具面与配置变化。</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="0.55" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#EEF6F6"/>
    </linearGradient>
    <linearGradient id="coralGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB8A78"/>
      <stop offset="1" stop-color="#EF5B47"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D3BE"/>
      <stop offset="1" stop-color="#0F9F91"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB8A78"/>
      <stop offset="0.5" stop-color="#F0A34A"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="panelShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23324A" flood-opacity="0.07"/>
    </filter>
    <filter id="arrowGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F0A34A" flood-opacity="0.28"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#23324A" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7ECF5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1160" fill="url(#bgGradient)"/>
  <rect width="1600" height="1160" fill="url(#grid)" opacity="0.55"/>

  <circle cx="1450" cy="120" r="260" fill="#FDE8E2" opacity="0.55"/>
  <circle cx="120" cy="1060" r="220" fill="#DDF7F1" opacity="0.5"/>
  <circle cx="1520" cy="1010" r="170" fill="#E8EEFC" opacity="0.55"/>

  <g>
    <rect x="64" y="58" width="286" height="30" rx="15" fill="#FFFFFF" stroke="#E4E9F1" filter="url(#chipShadow)"/>
    <circle cx="81" cy="73" r="4" fill="#14B8A6"/>
    <text x="94" y="78" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#475467">AGENT · RETRIEVAL · EVIDENCE</text>

    <text x="64" y="146" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#111827">Agent 检索链路优化前后对照</text>
    <text x="65" y="181" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="16" fill="#667085">multi-KB R3 · 2026-10-26 · 从“服务端代决”收敛到“模型自主 + 统一准入”</text>

    <g filter="url(#chipShadow)">
      <rect x="1092" y="58" width="104" height="34" rx="17" fill="#FFFFFF" stroke="#E4E9F1"/>
      <text x="1144" y="80" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="13" font-weight="700" fill="#344054">66 files</text>

      <rect x="1208" y="58" width="196" height="34" rx="17" fill="#FFFFFF" stroke="#E4E9F1"/>
      <text x="1306" y="80" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="13" font-weight="700" fill="#344054">+323 / −6,772 lines</text>

      <rect x="1416" y="58" width="120" height="34" rx="17" fill="#FFF8EA" stroke="#F6E2B8"/>
      <circle cx="1433" cy="75" r="4" fill="#F59E0B"/>
      <text x="1483" y="80" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="13" font-weight="700" fill="#9A6700">未提交</text>
    </g>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="64" y="220" width="670" height="680" rx="26" fill="#FFFFFF" stroke="#E7EAF0"/>
    <rect x="94" y="220" width="610" height="6" rx="3" fill="url(#coralGradient)"/>

    <rect x="92" y="252" width="98" height="28" rx="14" fill="#FFF1EE" stroke="#FFD9D2"/>
    <text x="141" y="271" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="11" font-weight="800" letter-spacing="1.4" fill="#D9482F">BEFORE</text>
    <text x="206" y="274" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="21" font-weight="800" fill="#111827">服务端代决 · 重编排</text>
    <text x="92" y="309" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="13.5" fill="#7A8499">工具面更大、预取更多、专用分支更多</text>

    <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif">
      <rect x="90" y="344" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="382" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="387" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">01</text>
      <text x="150" y="376" font-size="15.5" font-weight="800" fill="#1D2939">任务编排</text>
      <text x="150" y="398" font-size="13" fill="#667085">7 个 task_* 模块：计划、完成门、恢复、预算、进度</text>
      <rect x="580" y="358" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">重编排</text>

      <rect x="90" y="430" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="468" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="473" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">02</text>
      <text x="150" y="462" font-size="15.5" font-weight="800" fill="#1D2939">附件读取</text>
      <text x="150" y="484" font-size="13" fill="#667085">首轮自动 attachment_list + 检索预览，预览也占预算</text>
      <rect x="580" y="444" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="461" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">自动预取</text>

      <rect x="90" y="516" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="554" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="559" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">03</text>
      <text x="150" y="548" font-size="15.5" font-weight="800" fill="#1D2939">文档比较</text>
      <text x="150" y="570" font-size="13" fill="#667085">document_compare + comparison_expand + 只读报告 API</text>
      <rect x="580" y="530" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="547" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">专用栈</text>

      <rect x="90" y="602" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="640" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="645" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">04</text>
      <text x="150" y="634" font-size="15.5" font-weight="800" fill="#1D2939">多库关系</text>
      <text x="150" y="656" font-size="13" fill="#667085">primary 优先排序、预留席位，并自动视为权威</text>
      <rect x="580" y="616" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="633" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">primary 优先</text>

      <rect x="90" y="688" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="726" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="731" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">05</text>
      <text x="150" y="720" font-size="15.5" font-weight="800" fill="#1D2939">意图与工具面</text>
      <text x="150" y="742" font-size="13" fill="#667085">关键词推断 compare/compose；document flow 独立工具集</text>
      <rect x="580" y="702" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="719" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">关键词路由</text>

      <rect x="90" y="774" width="618" height="76" rx="15" fill="#FCFCFE" stroke="#EDF0F6"/>
      <circle cx="122" cy="812" r="16" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="122" y="817" text-anchor="middle" font-size="11" font-weight="800" fill="#D9482F">06</text>
      <text x="150" y="806" font-size="15.5" font-weight="800" fill="#1D2939">导航与配置</text>
      <text x="150" y="828" font-size="13" fill="#667085">全库遍历、预取候选；TASK_* / COMPARISON_* 多组开关</text>
      <rect x="580" y="788" width="102" height="24" rx="12" fill="#FFF1EE" stroke="#FFD9D2"/>
      <text x="631" y="805" text-anchor="middle" font-size="11" font-weight="700" fill="#D9482F">多组开关</text>
    </g>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="866" y="220" width="670" height="680" rx="26" fill="#FFFFFF" stroke="#E7EAF0"/>
    <rect x="896" y="220" width="610" height="6" rx="3" fill="url(#tealGradient)"/>

    <rect x="894" y="252" width="88" height="28" rx="14" fill="#E9FBF7" stroke="#CFF5EC"/>
    <text x="938" y="271" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="11" font-weight="800" letter-spacing="1.4" fill="#0F8F82">AFTER</text>
    <text x="996" y="274" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="21" font-weight="800" fill="#111827">模型自主 · 统一准入</text>
    <text x="894" y="309" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif" font-size="13.5" fill="#7A8499">工具面统一、按需读取、同级检索</text>

    <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif">
      <rect x="892" y="344" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="382" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="387" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">01</text>
      <text x="952" y="376" font-size="15.5" font-weight="800" fill="#1D2939">证据策略</text>
      <text x="952" y="398" font-size="13" fill="#667085">只保留 purpose 策略 + 来源感知预算，不再编排任务</text>
      <rect x="1382" y="358" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">策略 + 预算</text>

      <rect x="892" y="430" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="468" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="473" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">02</text>
      <text x="952" y="462" font-size="15.5" font-weight="800" fill="#1D2939">按需读取</text>
      <text x="952" y="484" font-size="13" fill="#667085">模型自行调用 attachment_list / search / read，不再预取</text>
      <rect x="1382" y="444" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="461" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">按需调用</text>

      <rect x="892" y="516" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="554" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="559" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">03</text>
      <text x="952" y="548" font-size="15.5" font-weight="800" fill="#1D2939">模型自比</text>
      <text x="952" y="570" font-size="13" fill="#667085">普通检索/读取工具即可比较，删掉专用工具与服务</text>
      <rect x="1382" y="530" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="547" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">模型自比</text>

      <rect x="892" y="602" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="640" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="645" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">04</text>
      <text x="952" y="634" font-size="15.5" font-weight="800" fill="#1D2939">同级检索</text>
      <text x="952" y="656" font-size="13" fill="#667085">所有已选库同级；primary 只决定会话归属</text>
      <rect x="1382" y="616" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="633" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">同级</text>

      <rect x="892" y="688" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="726" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="731" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">05</text>
      <text x="952" y="720" font-size="15.5" font-weight="800" fill="#1D2939">统一工具面</text>
      <text x="952" y="742" font-size="13" fill="#667085">模型自主选工具；capability 过滤是唯一可见性边界</text>
      <rect x="1382" y="702" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="719" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">统一过滤</text>

      <rect x="892" y="774" width="618" height="76" rx="15" fill="#FBFEFD" stroke="#E3F4F0"/>
      <circle cx="924" cy="812" r="16" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="924" y="817" text-anchor="middle" font-size="11" font-weight="800" fill="#0F8F82">06</text>
      <text x="952" y="806" font-size="15.5" font-weight="800" fill="#1D2939">目录 + 预判</text>
      <text x="952" y="828" font-size="13" fill="#667085">list_knowledge_sources 导航；普通问题跳过全库扫描</text>
      <rect x="1382" y="788" width="102" height="24" rx="12" fill="#E9FBF7" stroke="#CFF5EC"/>
      <text x="1433" y="805" text-anchor="middle" font-size="11" font-weight="700" fill="#0F8F82">导航 + 预判</text>
    </g>
  </g>

  <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif">
    <line x1="800" y1="360" x2="800" y2="850" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 8"/>
    <circle cx="800" cy="420" r="3" fill="#F59E0B"/>
    <circle cx="800" cy="760" r="3" fill="#14B8A6"/>

    <text x="800" y="382" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2.2" fill="#98A2B3" paint-order="stroke" stroke="#F7FAFD" stroke-width="5" stroke-linejoin="round">OPTIMIZATION</text>
    <text x="800" y="409" text-anchor="middle" font-size="18" font-weight="800" fill="#344054" paint-order="stroke" stroke="#F7FAFD" stroke-width="7" stroke-linejoin="round">做减法</text>

    <circle cx="800" cy="560" r="44" fill="url(#arrowGradient)" filter="url(#arrowGlow)"/>
    <path d="M 784 551 h 17 v -9 l 17 18 l -17 18 v -9 h -17 z" fill="#FFFFFF"/>

    <text x="800" y="636" text-anchor="middle" font-size="16" font-weight="800" fill="#344054" paint-order="stroke" stroke="#F7FAFD" stroke-width="7" stroke-linejoin="round">优化</text>
    <text x="800" y="657" text-anchor="middle" font-size="10.5" letter-spacing="1.2" fill="#98A2B3" paint-order="stroke" stroke="#F7FAFD" stroke-width="5" stroke-linejoin="round">服务端 → 模型</text>

    <text x="800" y="706" text-anchor="middle" font-size="18" font-weight="800" fill="#344054" paint-order="stroke" stroke="#F7FAFD" stroke-width="7" stroke-linejoin="round">收敛边界</text>
    <text x="800" y="729" text-anchor="middle" font-size="11" fill="#98A2B3" paint-order="stroke" stroke="#F7FAFD" stroke-width="5" stroke-linejoin="round">统一准入</text>
  </g>

  <g font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif">
    <text x="64" y="952" font-size="20" font-weight="800" fill="#111827">优化结果</text>
    <text x="64" y="977" font-size="13" fill="#667085">以删减为主：减少服务端预取、专用分支和重复编排，而不是再增加一层</text>
    <line x1="64" y1="992" x2="1536" y2="992" stroke="#E4E9F1"/>

    <g filter="url(#chipShadow)">
      <rect x="64" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
      <rect x="84" y="1010" width="42" height="4" rx="2" fill="#F97362"/>
      <text x="84" y="1050" font-size="29" font-weight="800" fill="#111827">−6,772</text>
      <text x="84" y="1074" font-size="12.5" font-weight="700" fill="#475467">净删除行数</text>
      <text x="84" y="1093" font-size="11" fill="#98A2B3">66 files · +323 added</text>

      <rect x="312" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
      <rect x="332" y="1010" width="42" height="4" rx="2" fill="#F59E0B"/>
      <text x="332" y="1050" font-size="29" font-weight="800" fill="#111827">7 → 0</text>
      <text x="332" y="1074" font-size="12.5" font-weight="700" fill="#475467">task_* 模块</text>
      <text x="332" y="1093" font-size="11" fill="#98A2B3">计划 / 完成 / 恢复 / 预算</text>

      <rect x="560" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
      <rect x="580" y="1010" width="42" height="4" rx="2" fill="#8B5CF6"/>
      <text x="580" y="1050" font-size="29" font-weight="800" fill="#111827">1 套</text>
      <text x="580" y="1074" font-size="12.5" font-weight="700" fill="#475467">专用比较栈移除</text>
      <text x="580" y="1093" font-size="11" fill="#98A2B3">工具 + 服务 + 报告 API</text>

      <rect x="808" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
      <rect x="828" y="1010" width="42" height="4" rx="2" fill="#14B8A6"/>
      <text x="828" y="1050" font-size="29" font-weight="800" fill="#111827">0 次</text>
      <text x="828" y="1074" font-size="12.5" font-weight="700" fill="#475467">首轮附件预取</text>
      <text x="828" y="1093" font-size="11" fill="#98A2B3">改为模型按需读取</text>

      <rect x="1056" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
      <rect x="1076" y="1010" width="42" height="4" rx="2" fill="#3B82F6"/>
      <text x="1076" y="1050" font-size="29" font-weight="800" fill="#111827">1 个</text>
      <text x="1076" y="1074" font-size="12.5" font-weight="700" fill="#475467">统一工具面</text>
      <text x="1076" y="1093" font-size="11" fill="#98A2B3">capability 过滤</text>

      <rect x="1304" y="1010" width="232" height="98" rx="18" fill="#FFFFFF" stroke="#E7EAF0"/>
