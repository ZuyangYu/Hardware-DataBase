# Hardware DataBase 项目自管 Redis（实时平面）
#
# 定位：取消快路径 / 跨进程 SSE 事件流。持久真相在 SQLite/PostgreSQL，
# Redis 只是加速层——挂掉必须只降级、不阻断（fail-soft）。
#
# 由 docker-compose.yml 挂载；密码通过 compose 的 --requirepass 注入，
# 不落盘到本文件。仅监听宿主机 127.0.0.1（由 ports 映射约束）。

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

daemonize no
loglevel notice
logfile ""
databases 16

# 内存上限与逐出策略：实时键全部带 TTL，内存压力下只逐出可再生的 TTL 键，
# 不逐出无 TTL 键（避免误伤同一实例上的其它数据）。
maxmemory 256mb
maxmemory-policy volatile-lru

# AOF 保证容器重启后取消键/事件流不整体丢失；everysec 兼顾实时性与磁盘开销。
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 纯实时平面，不需要 RDB 快照（避免 fork 抖动）。
save ""

# 慢命令留痕，便于定位阻塞事件流读写的调用方。
slowlog-log-slower-than 10000
slowlog-max-len 128
