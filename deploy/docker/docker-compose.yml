# Hardware DataBase —— Docker 运行时编排（不含 build，离线包直接可用）
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   docker compose -f deploy/docker/docker-compose.yml logs -f api
#
# 拓扑（默认全在一个 compose 里，新机器一条命令起全套）：
#   migrate(一次性) ──> api(8001) ──> web(8080->80)
#        │                └ api 内部按 lifespan 拉起 chat/authoring/parse
#        │                  worker + export worker + memory worker
#        └ postgres(pgvector, 内部网络)   redis(内部网络，必需)
#   外部依赖（不在本编排内）：RAGFlow、LLM（Ollama 或 OpenAI 兼容 API）
#
# 组件定位：PG 是账本（唯一真相），Redis 是实时平面（取消快路径 + 跨进程 SSE，
# 与 PG 一样随应用部署；代码对 Redis 故障 fail-soft，但部署上不再视为可选）。
#
# 数据落点（bind mount，宿主机可见、可 tar、可搬）：
#   ./config/.env  应用配置（管理页「系统配置」保存会原子写回这里，必须可写）
#   ./storage      账本归档/导出/日志（PG 之外的文件类数据）
#   hdb-pg-data    PostgreSQL 数据卷（账本本体）
#
# migrate 是启动门槛：它建控制面 schema（应用永不隐式建表，全新库必须由它建）
# 并逐域幂等建表；失败会拦住 api/worker（service_completed_successfully）。

name: hardware-database

x-app-env: &app-env
  HDB_ENV_PATH: /app/config/.env
  HDB_API_HOST: 0.0.0.0
  HDB_API_PORT: "8001"
  TZ: ${TZ:-Asia/Shanghai}

# 账本：5 组后端全部指向 compose 内的 PG（外部 PG 见 README「指向已有 PostgreSQL」）
# 密码只在运行期需要：这里用空默认值，保证 `docker compose build` / `config` 不被阻塞。
# 没设密码时 postgres 会拒绝初始化（官方镜像行为）、api 也会连接失败 —— 启动期即报错。
x-pg-dsn: &pg-dsn "postgresql://hdb:${HDB_PG_PASSWORD:-}@postgres:5432/hdb"
x-pg-env: &pg-env
  CONTROL_PLANE_BACKEND: postgres
  CONTROL_PLANE_DATABASE_URL: *pg-dsn
  MEMORY_STORE_BACKEND: postgres
  MEMORY_DATABASE_URL: *pg-dsn
  AGENT_CHECKPOINT_BACKEND: postgres
  AGENT_CHECKPOINT_DATABASE_URL: *pg-dsn
  DOCUMENT_AUTHORING_CHECKPOINTER_BACKEND: postgres
  DOCUMENT_AUTHORING_CHECKPOINTER_DATABASE_URL: *pg-dsn
  RESOURCE_GOVERNOR_BACKEND: postgres
  RESOURCE_GOVERNOR_DATABASE_URL: *pg-dsn
  RESOURCE_GOVERNOR_SCOPE: deployment

x-app: &app
  image: ${HDB_APP_IMAGE:-hardware-database-app:latest}
  restart: unless-stopped
  environment:
    <<: [*app-env, *pg-env]
  volumes:
    - ./config:/app/config
    - ./storage:/app/storage
  # 让容器能访问宿主机上的 Ollama / RAGFlow（Linux 默认没有 host.docker.internal）
  extra_hosts:
    - "host.docker.internal:host-gateway"
  stop_grace_period: 30s

services:
  # 一次性初始化/校验：建控制面 schema + 逐域建表 + 认证域形状校验。
  # 幂等，可重复执行；失败会拦住 api/worker。
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "src.storage.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: [*app-env, *pg-env]
      # API 单进程内含 worker 时，worker 由 API 拉起（单机部署的默认形态）。
      # 若要多角色拆分/多副本，把下面三个开关设为 0 并单独起 worker 容器。
      HDB_API_SPAWN_WORKER: "1"
      HDB_API_SPAWN_EXPORT_WORKER: "1"
      HDB_API_SPAWN_MEMORY_WORKER: "1"
      WORKER_ROLE: all
    ports:
      # 只绑回环：对外统一走 web(nginx)；同机 CLI/MCP 仍可直连 8001。
      - "127.0.0.1:${HDB_API_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${HDB_WEB_IMAGE:-hardware-database-web:latest}
    restart: unless-stopped
    ports:
      - "${HDB_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  # 账本库（pgvector 镜像：记忆投影的语义索引需要 vector 扩展）。
  postgres:
    image: ${HDB_PG_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: hdb
      POSTGRES_PASSWORD: ${HDB_PG_PASSWORD:-}
      POSTGRES_DB: hdb
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=512MB
      - -c
      - timezone=UTC
    volumes:
      - hdb-pg-data:/var/lib/postgresql/data
      # 首次初始化（数据卷为空时一次）：装 vector 扩展。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdb -d hdb"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 实时平面（必需）：取消快路径 + 跨进程 SSE 事件流。
  # 与项目自管实例（deploy/redis/redis.conf）一致：AOF 开、RDB 关。
  # 只存带 TTL 的加速键（真相在 PG），因此不需要备份；代码侧 fail-soft。
  redis:
    image: ${HDB_REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - hdb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  hdb-pg-data:
    # 注意：不能复用 deploy/postgres 自管实例的卷名（hardware-database-postgres-data）——
    # 同一个数据目录被两个 PG 实例打开会绕过锁文件检查，有损坏风险。
    name: hardware-database-app-postgres-data
  hdb-redis-data:
    # 同样不能复用 deploy/redis 自管实例的卷名（hardware-database-redis-data）：
    # 两个 Redis 进程追加同一个 AOF 会损坏它。
    name: hardware-database-app-redis-data
