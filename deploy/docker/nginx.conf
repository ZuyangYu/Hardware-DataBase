# Hardware DataBase 前端/网关配置（web 容器内）。
#
# 职责：
#   1. 提供 Vite 构建产物（SPA 路由回退到 index.html）
#   2. 把 /api 与 /health 反代到 api 容器，并让 SSE 实时推送真正“实时”

server {
    listen 80;
    server_name _;

    # 用 Docker 内置 DNS 做运行时解析：api 容器重建换 IP 后不会被旧地址卡成 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8001;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 上传文档/附件走本网关转发，默认 1m 会直接 413。
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Vite 产物带内容哈希，可长缓存。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 不缓存，升级后立即生效。
    location = /index.html {
        expires -1;
    }

    # 反向代理公共头。SSE 依赖 proxy_buffering off，否则前端轨迹会攒批延迟。
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 长问答 + 导出/评估等长任务：读超时放宽到 1 小时。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # 其余路径交给 SPA 前端路由（/login、/chat/xxx 等刷新时不 404）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
