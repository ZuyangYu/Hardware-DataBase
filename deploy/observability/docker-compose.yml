name: hardware-database-observability

services:
  otel-storage-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /wal && chmod 0700 /wal"]
    volumes:
      - otel-collector-wal:/wal
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OBS_PHOENIX_PROJECT: ${OBS_PHOENIX_PROJECT:-hardware-database}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-collector-wal:/var/lib/otelcol-storage
    expose:
      - "8888"
    ports:
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_OTLP_GRPC_PORT:-4317}:4317"
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_OTLP_HTTP_PORT:-4318}:4318"
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_METRICS_PORT:-9464}:9464"
    depends_on:
      otel-storage-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      loki:
        condition: service_started
      phoenix:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ${ALERTMANAGER_CONFIG:-./alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_ALERTMANAGER_PORT:-9093}:9093"

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  phoenix-db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${PHOENIX_DB_USER:-phoenix}
      POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD must be set}
      POSTGRES_DB: ${PHOENIX_DB_NAME:-phoenix}
    volumes:
      - phoenix-db-data:/var/lib/postgresql/data

  phoenix:
    image: arizephoenix/phoenix:19.13.0
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${PHOENIX_DB_USER:-phoenix}:${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD must be set}@phoenix-db:5432/${PHOENIX_DB_NAME:-phoenix}
      PHOENIX_PROJECT_NAME: ${OBS_PHOENIX_PROJECT:-hardware-database}
    ports:
      - "${OBS_BIND_HOST:-127.0.0.1}:${OBS_PHOENIX_PORT:-6006}:6006"
    depends_on:
      - phoenix-db

volumes:
  otel-collector-wal:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  phoenix-db-data:
  alertmanager-data:
