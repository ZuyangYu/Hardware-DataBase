groups:
  - name: hardware-database-telemetry-accounting
    rules:
      - alert: HdbCollectorDown
        expr: absent(up{job="otel-collector-self"}) or max(up{job="otel-collector-self"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Collector self-metrics scrape is unavailable"
      - alert: HdbCollectorQueuePressure
        expr: max by (exporter, data_type) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector persistent sending queue exceeds 80% capacity"
      - alert: HdbCollectorSendFailures
        expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector trace exports are failing; inspect retry queues"
      - alert: HdbCollectorEnqueueLoss
        expr: sum(increase(otelcol_exporter_enqueue_failed_spans_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Collector spans failed to enter persistent queues; receiver ACK does not imply delivery"
      - alert: HdbRequiredWorkerRoleMissing
        expr: max(hdb_worker_required_roles_missing) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A configured required worker role has no fresh durable heartbeat"
      - alert: HdbQualityWorkerMetricsAbsent
        expr: absent_over_time(hdb_worker_required_roles_missing[5m])
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Quality worker operational gauges are absent; check process and telemetry delivery"
      - alert: HdbCostBudgetKnownAmountExceeded
        expr: max(hdb_cost_budget_exceeded) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A versioned active cost budget is exceeded by recorded known amounts"
      - alert: HdbCostBudgetCoverageInsufficient
        expr: max(hdb_cost_budget_unknown) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An active cost budget contains unknown costs; spend completeness is not proven"
      - alert: HdbCostAccountingLoss
        expr: sum(increase(hdb_cost_sink_events_total{status=~"dropped|corrupt"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Cost accounting events were dropped or quarantined; coverage is incomplete"
      - alert: HdbCostAccountingWritesFailing
        expr: sum(rate(hdb_cost_sink_events_total{status="write_failures"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cost accounting DB/spool writes are failing"
  - name: hardware-database-slo
    rules:
      - alert: HdbChatSloFastBurn
        expr: (max by (workload) (hdb_slo_burn_rate{window="1h"}) > 14.4) and (max by (workload) (hdb_slo_burn_rate{window="5m"}) > 14.4) and (max by (workload) (hdb_slo_eligible{window="5m"}) >= max by (workload) (hdb_slo_minimum_events{window="5m"}))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Durable chat SLO error budget is burning above 14.4x in both 1h and 5m"
      - alert: HdbChatSloSlowBurn
        expr: (max by (workload) (hdb_slo_burn_rate{window="6h"}) > 6) and (max by (workload) (hdb_slo_burn_rate{window="30m"}) > 6) and (max by (workload) (hdb_slo_eligible{window="30m"}) >= max by (workload) (hdb_slo_minimum_events{window="30m"}))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Durable chat SLO error budget is burning above 6x in both 6h and 30m"
      - alert: HdbChatErrorRateHigh
        expr: sum(rate(hdb_chat_turns_total{status="failed"}[5m])) / sum(rate(hdb_chat_turns_total{status=~"completed|failed"}[5m])) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hardware DataBase chat error rate is above 10%"

      - alert: HdbChatLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(hdb_chat_turn_duration_seconds_bucket[5m]))) > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hardware DataBase chat p95 latency is above 8 seconds"

      - alert: HdbQueueBacklogHigh
        expr: max(hdb_queue_depth) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hardware DataBase durable queue backlog is above 100"

      - alert: HdbWorkerFailures
        expr: sum(rate(hdb_worker_task_failed_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hardware DataBase worker failures are occurring"

      - alert: HdbRetrievalEmptyRateHigh
        expr: sum(rate(hdb_rag_zero_hit_total[10m])) / sum(rate(hdb_rag_calls_total[10m])) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retrieval empty-result rate is above 30%"

      - alert: HdbLlmLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(hdb_llm_duration_seconds_bucket[5m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM p95 latency is above 20 seconds"

  - name: hardware-database-production-hardening
    rules:
      - alert: HdbStaleAuthorityWrites
        expr: sum(rate(hdb_conversation_stale_write_rejected_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A superseded chat attempt is writing authoritative state"

      - alert: HdbResourceRejections
        expr: sum(rate(hdb_resource_rejected_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Resource governor is rejecting admissions above 1/s"

      - alert: HdbResourceQueueDeep
        expr: max(hdb_resource_queue_waiting) > 16
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 16 callers are queued for one resource"

      - alert: HdbResourceUncertainPermits
        expr: max(hdb_resource_uncertain) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Uncertain resource permits are not draining"

      - alert: HdbResourceUncertainEscalated
        expr: increase(hdb_resource_uncertain_escalated_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Uncertain permits exceeded the escalation window; new admissions for the resource are paused"

      - alert: HdbAttachmentWaitTimeouts
        expr: increase(hdb_conversation_attachment_wait_seconds_count{status="timed_out"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Attachment waits are timing out; queued turns were released"

      - alert: HdbHeavyQueueStarvation
        expr: max by (queue) (hdb_queue_oldest_age_seconds{queue=~"export"}) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heavy job queue oldest item exceeds 10 minutes"

      - alert: HdbRetrievalExecutorShed
        expr: sum(rate(hdb_retrieval_executor_attempts_total{status="saturated"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Shared retrieval executor is shedding queued calls"

      - alert: HdbActionParallelFailures
        expr: sum(rate(hdb_action_parallel_layers_total{status="failed"}[10m])) > 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Action DAG parallel layers are failing"
