<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Hardware-DataBase-observability 当前监测架构</title>
  <desc id="desc">API、Worker、Streamlit 通过 OpenTelemetry Collector 将 Trace、Metrics、Logs 分别发送到 Tempo、Phoenix、Prometheus 和 Loki，并由 Grafana、Phoenix 和管理后台查看。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style><![CDATA[
      * { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Noto Sans", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 15px; fill: #cbd5e1; }
      .section { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .section-note { font-size: 13px; fill: #64748b; }
      .node-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .node-text { font-size: 13px; fill: #334155; }
      .node-small { font-size: 12px; fill: #64748b; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; }
      .flow-dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .flow-trace { fill: none; stroke: #ea580c; stroke-width: 2.4; }
      .flow-metric { fill: none; stroke: #2563eb; stroke-width: 2.4; }
      .flow-log { fill: none; stroke: #059669; stroke-width: 2.4; }
      .flow-ui { fill: none; stroke: #7c3aed; stroke-width: 2.2; }
      .label { font-size: 12px; font-weight: 700; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .label-trace { fill: #c2410c; }
      .label-metric { fill: #1d4ed8; }
      .label-log { fill: #047857; }
      .label-ui { fill: #6d28d9; }
      .legend { font-size: 12px; fill: #cbd5e1; }
    ]]></style>
  </defs>

  <rect width="1800" height="1260" fill="#f8fafc"/>
  <rect width="1800" height="82" fill="#0f172a"/>
  <text x="42" y="38" class="title">Hardware-DataBase-observability 当前监测架构</text>
  <text x="42" y="64" class="subtitle">基于当前分支代码与 deploy/observability Compose 配置 · Telemetry fail-open</text>

  <g transform="translate(1240 28)">
    <line x1="0" y1="0" x2="28" y2="0" class="flow-trace"/>
    <text x="38" y="4" class="legend">Trace</text>
    <line x1="98" y1="0" x2="126" y2="0" class="flow-metric"/>
    <text x="136" y="4" class="legend">Metrics</text>
    <line x1="218" y1="0" x2="246" y2="0" class="flow-log"/>
    <text x="256" y="4" class="legend">Logs</text>
    <line x1="318" y1="0" x2="346" y2="0" class="flow-ui"/>
    <text x="356" y="4" class="legend">查看入口</text>
  </g>

  <!-- 业务运行面 -->
  <rect x="35" y="108" width="1730" height="330" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="142" class="section">① 业务运行面 · 被监测对象</text>
  <text x="60" y="165" class="section-note">React 通过 API 访问；Streamlit 保留进程内调用；API 和 Worker 共享 SQLite 队列与本地存储。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="205" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="172" y="237" text-anchor="middle" class="node-title">React 前端</text>
    <text x="172" y="260" text-anchor="middle" class="node-text">HTTP / SSE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="322" width="205" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="172" y="354" text-anchor="middle" class="node-title">Streamlit UI</text>
    <text x="172" y="377" text-anchor="middle" class="node-text">进程内调用</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="345" y="198" width="235" height="95" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="462" y="232" text-anchor="middle" class="node-title">FastAPI API</text>
    <text x="462" y="256" text-anchor="middle" class="node-text">hardware-database-api</text>
    <text x="462" y="277" text-anchor="middle" class="node-small">REST / SSE / Health</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="345" y="315" width="235" height="95" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="462" y="349" text-anchor="middle" class="node-title">Durable Worker</text>
    <text x="462" y="373" text-anchor="middle" class="node-text">hardware-database-worker</text>
    <text x="462" y="394" text-anchor="middle" class="node-small">Chat / Parse 队列</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="655" y="215" width="315" height="145" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="812" y="248" text-anchor="middle" class="node-title">Agent / LangGraph</text>
    <text x="812" y="273" text-anchor="middle" class="node-text">检索工具 · LLM · RAG</text>
    <text x="812" y="297" text-anchor="middle" class="node-text">文档生成 · Evaluation</text>
    <text x="812" y="326" text-anchor="middle" class="node-small">Manual spans / metrics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1050" y="198" width="255" height="95" rx="10" fill="#e8f1fb" stroke="#2563eb" stroke-width="1.6"/>
    <text x="1177" y="232" text-anchor="middle" class="node-title">外部依赖</text>
    <text x="1177" y="256" text-anchor="middle" class="node-text">RAGFlow</text>
    <text x="1177" y="277" text-anchor="middle" class="node-small">Ollama / OpenAI-compatible LLM</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1050" y="315" width="315" height="95" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="1207" y="349" text-anchor="middle" class="node-title">SQLite + 本地存储</text>
    <text x="1207" y="373" text-anchor="middle" class="node-text">auth.db · pipeline · logs</text>
    <text x="1207" y="394" text-anchor="middle" class="node-small">Audit / QueryTrace / Evidence / Queue</text>
  </g>
  <text x="1450" y="245" class="node-title">监测对象</text>
  <text x="1450" y="272" class="node-text">API 请求</text>
  <text x="1450" y="295" class="node-text">Agent / Retrieval</text>
  <text x="1450" y="318" class="node-text">LLM / Worker</text>
  <text x="1450" y="341" class="node-text">Evaluation / Authoring</text>
  <text x="1450" y="382" class="node-small">业务事实仍保留在 SQLite</text>

  <path d="M275 246 H345" class="flow" marker-end="url(#arrow)"/>
  <text x="290" y="237" class="label">REST / SSE</text>
  <path d="M580 246 H655" class="flow" marker-end="url(#arrow)"/>
  <path d="M580 362 H615 V300 H655" class="flow" marker-end="url(#arrow)"/>
  <path d="M275 362 H615 V330 H655" class="flow" marker-end="url(#arrow)"/>
  <path d="M970 252 H1050" class="flow" marker-end="url(#arrow)"/>
  <path d="M970 330 H1050" class="flow" marker-end="url(#arrow)"/>
  <text x="986" y="243" class="label">HTTP</text>
  <text x="986" y="321" class="label">业务状态</text>

  <!-- 应用内观测层 -->
  <rect x="35" y="470" width="1730" height="190" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="60" y="504" class="section">② 应用内可观测性层</text>
  <text x="60" y="527" class="section-note">统一初始化 OTel Provider；自动埋点 + 手工语义 Span；敏感正文默认不进入 telemetry。</text>

  <g filter="url(#shadow)">
    <rect x="105" y="550" width="415" height="82" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="312" y="581" text-anchor="middle" class="node-title">OpenTelemetry SDK</text>
    <text x="312" y="605" text-anchor="middle" class="node-text">FastAPI / HTTPX / Requests 自动埋点</text>
    <text x="312" y="623" text-anchor="middle" class="node-small">Trace · Metrics · Logs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="550" width="300" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="760" y="581" text-anchor="middle" class="node-title">隐私与脱敏</text>
    <text x="760" y="605" text-anchor="middle" class="node-text">Query / Evidence / LLM 正文</text>
    <text x="760" y="623" text-anchor="middle" class="node-small">OBS_CAPTURE_* 默认关闭</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1000" y="550" width="300" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="1150" y="581" text-anchor="middle" class="node-title">W3C Trace Context</text>
    <text x="1150" y="605" text-anchor="middle" class="node-text">跨线程 / 线程池 / SQLite Queue</text>
    <text x="1150" y="623" text-anchor="middle" class="node-small">query_traces.otel_trace_id</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1390" y="535" width="315" height="112" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="1547" y="571" text-anchor="middle" class="node-title">OpenTelemetry Collector</text>
    <text x="1547" y="596" text-anchor="middle" class="node-text">OTLP gRPC :4317 / HTTP :4318</text>
    <text x="1547" y="619" text-anchor="middle" class="node-small">memory_limiter + batch</text>
  </g>

  <path d="M462 410 V480 H210 V550" class="flow-dash" marker-end="url(#arrow-orange)"/>
  <path d="M812 360 V480 H415 V550" class="flow-dash" marker-end="url(#arrow-orange)"/>
  <path d="M760 591 H610" class="flow-dash" marker-end="url(#arrow-orange)"/>
  <path d="M910 591 H1000" class="flow-dash" marker-end="url(#arrow-orange)"/>
  <path d="M1300 591 H1390" class="flow-trace" marker-end="url(#arrow-orange)"/>
  <text x="1320" y="580" class="label label-trace">OTLP</text>

  <!-- telemetry 后端 -->
  <rect x="35" y="692" width="1730" height="235" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="60" y="726" class="section">③ Telemetry 后端与存储</text>
  <text x="60" y="749" class="section-note">Collector fan-out：Trace → Tempo + Phoenix；Metrics → Prometheus；Logs → Loki。</text>

  <g filter="url(#shadow)">
    <rect x="100" y="785" width="250" height="82" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.7"/>
    <text x="225" y="817" text-anchor="middle" class="node-title">Tempo</text>
    <text x="225" y="841" text-anchor="middle" class="node-text">Trace 存储</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="785" width="250" height="82" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.7"/>
    <text x="535" y="817" text-anchor="middle" class="node-title">Phoenix</text>
    <text x="535" y="841" text-anchor="middle" class="node-text">AI / RAG Trace</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="785" width="300" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/>
    <text x="870" y="817" text-anchor="middle" class="node-title">Prometheus exporter</text>
    <text x="870" y="841" text-anchor="middle" class="node-text">Collector :9464</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1080" y="785" width="250" height="82" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.7"/>
    <text x="1205" y="817" text-anchor="middle" class="node-title">Loki</text>
    <text x="1205" y="841" text-anchor="middle" class="node-text">Structured Logs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1390" y="785" width="275" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/>
    <text x="1527" y="817" text-anchor="middle" class="node-title">Prometheus</text>
    <text x="1527" y="841" text-anchor="middle" class="node-text">15s scrape + 告警规则</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="878" width="250" height="35" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="535" y="901" text-anchor="middle" class="node-small">Phoenix PostgreSQL</text>
  </g>

  <path d="M1410 647 V710 H225 V785" class="flow-trace" marker-end="url(#arrow-orange)"/>
  <path d="M1480 647 V730 H535 V785" class="flow-trace" marker-end="url(#arrow-orange)"/>
  <path d="M1570 647 V785 H1020" class="flow-metric" marker-end="url(#arrow-blue)"/>
  <path d="M1650 647 V710 H1205 V785" class="flow-log" marker-end="url(#arrow-green)"/>
  <text x="280" y="704" class="label label-trace">traces</text>
  <text x="600" y="724" class="label label-trace">traces</text>
  <text x="1040" y="775" class="label label-metric">metrics</text>
  <text x="1230" y="704" class="label label-log">logs OTLP HTTP</text>
  <path d="M535 867 V878" class="flow-dash" marker-end="url(#arrow)"/>
  <path d="M1527 867 V900 H870 V867" class="flow-metric" marker-end="url(#arrow-blue)"/>
  <text x="1120" y="893" class="label label-metric">scrape 15s</text>

  <!-- 查看入口 -->
  <rect x="35" y="960" width="1730" height="245" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="60" y="994" class="section">④ 运维与业务查看入口</text>
  <text x="60" y="1017" class="section-note">Grafana 查看技术指标、Trace 和日志；Phoenix 查看 AI Trace；管理后台查看业务事实和依赖状态。</text>

  <g filter="url(#shadow)">
    <rect x="145" y="1060" width="430" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="360" y="1093" text-anchor="middle" class="node-title">Grafana :3000</text>
    <text x="360" y="1118" text-anchor="middle" class="node-text">Prometheus / Tempo / Loki</text>
    <text x="360" y="1140" text-anchor="middle" class="node-small">Overview Dashboard + Trace Drilldown</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="1060" width="330" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="865" y="1093" text-anchor="middle" class="node-title">Phoenix :6006</text>
    <text x="865" y="1118" text-anchor="middle" class="node-text">AI / RAG Trace Explorer</text>
    <text x="865" y="1140" text-anchor="middle" class="node-small">PostgreSQL 持久化</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1155" y="1042" width="470" height="128" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="1390" y="1075" text-anchor="middle" class="node-title">React / Streamlit 管理后台</text>
    <text x="1390" y="1100" text-anchor="middle" class="node-text">System Status · Logs · Task Metrics</text>
    <text x="1390" y="1123" text-anchor="middle" class="node-small">/health · /system/status · /logs/*</text>
    <text x="1390" y="1145" text-anchor="middle" class="node-small">QueryTrace → Grafana / Phoenix 链接</text>
  </g>

  <path d="M225 867 V1030 H360 V1060" class="flow-ui" marker-end="url(#arrow-purple)"/>
  <path d="M535 867 V1030 H360 V1060" class="flow-ui" marker-end="url(#arrow-purple)"/>
  <path d="M1205 867 V1030 H360 V1060" class="flow-ui" marker-end="url(#arrow-purple)"/>
  <path d="M535 867 V1030 H865 V1060" class="flow-ui" marker-end="url(#arrow-purple)"/>
  <path d="M580 293 V445 H1725 V1030 H1625 V1042" class="flow-dash" marker-end="url(#arrow-purple)"/>
  <text x="220" y="1038" class="label label-ui">数据源</text>
  <text x="1240" y="1038" class="label label-ui">业务 API / 权限过滤</text>

  <rect x="35" y="1218" width="1730" height="1" fill="#cbd5e1"/>
  <text x="60" y="1245" class="node-small">当前边界：Prometheus 已配置 6 类告警，但 Compose 未配置 Alertmanager；/task-metrics 是业务聚合接口，不是 Prometheus /metrics 端点。</text>
</svg>
