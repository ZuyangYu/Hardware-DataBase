global:
  resolve_timeout: 5m
route:
  receiver: operators
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  # Alerts remain visible in Alertmanager. Set ALERTMANAGER_CONFIG to an
  # operator-owned file with webhook_configs/email_configs to deliver them.
  - name: operators
